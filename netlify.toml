[build]
  base = "client"
  command = "npm run build"
  publish = "dist"
[build.environment]
  VITE_API_URL = "https://orniva-jewelry-store.onrender.com"
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
